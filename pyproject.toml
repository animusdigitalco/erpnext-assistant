[project]
name = "erpnext_assistant"
authors = [
    { name = "Animus Digital", email = "jon@animusdigital.co" },
]
description = "A read-only AI assistant for your ERPNext system. Bring your own Anthropic API key."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = [
    "anthropic",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
